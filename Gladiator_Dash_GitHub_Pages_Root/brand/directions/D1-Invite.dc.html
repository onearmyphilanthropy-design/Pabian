<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --bg:#10151F;
      --card:#171E2C;
      --cyan:#4FC7E8;
      --red:#E3452F;
      --ink:#F4F6F8;
      --muted:#8C97A8;
    }
    body{margin:0;}
    .fo-h1{font-family:'Bebas Neue',sans-serif; letter-spacing:0.01em;}
  </style>
</helmet>
<div style="width:390px; min-height:844px; background:var(--bg); font-family:'Work Sans',sans-serif; color:var(--ink); box-sizing:border-box; display:flex; flex-direction:column;">

  <div style="display:flex; align-items:center; gap:10px; padding:22px 22px 0;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4FC7E8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 13c0-5 3.5-9 8-9s8 4 8 9"/>
      <path d="M4 13v3a2 2 0 0 0 2 2h1"/>
      <path d="M20 13v3a2 2 0 0 1-2 2h-1"/>
      <path d="M12 4v6"/>
      <path d="M9 10l1.5 4"/>
      <path d="M15 10l-1.5 4"/>
    </svg>
    <div class="fo-h1" style="font-size:16px; letter-spacing:0.05em;">MUD BOYS</div>
  </div>

  <div style="margin:20px 22px 0; background:var(--card); border-radius:4px; padding:24px 20px; text-align:center;">
    <div style="font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted);">Your friends are running at</div>
    <div class="fo-h1" style="font-size:52px; color:var(--cyan); margin-top:4px; line-height:1;">9:30 AM</div>

    <div style="display:flex; justify-content:center; gap:8px; margin-top:18px;">
      <div style="width:34px; height:34px; border-radius:50%; background:#233047; border:1.5px solid var(--cyan); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;">JP</div>
      <div style="width:34px; height:34px; border-radius:50%; background:#233047; border:1.5px solid var(--cyan); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;">RM</div>
      <div style="width:34px; height:34px; border-radius:50%; background:#233047; border:1.5px solid var(--cyan); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;">CB</div>
    </div>
    <div style="font-size:12.5px; color:var(--muted); margin-top:8px;">Jacob P. · Ryan M. · Connor B.</div>

    <div style="display:inline-block; margin-top:14px; background:var(--red); color:#fff; font-size:11px; font-weight:700; letter-spacing:0.05em; padding:5px 10px; border-radius:2px; text-transform:uppercase;">17 spots left</div>
  </div>

  <div style="padding:18px 22px 0;">
    <div style="background:var(--cyan); color:#0A1119; font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:0.03em; text-align:center; padding:15px; border-radius:3px;">JOIN THEM AT 9:30 →</div>
    <div style="text-align:center; font-size:13px; color:var(--muted); margin-top:12px;">See other heat times ↓</div>
  </div>

  <div style="flex:1;"></div>

  <div style="margin:0 22px 22px; display:flex; align-items:center; justify-content:center; gap:8px; background:var(--card); border-radius:3px; padding:13px;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8C97A8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v14"/></svg>
    <div style="font-size:13px; color:var(--muted); font-weight:600;">Share this group</div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
