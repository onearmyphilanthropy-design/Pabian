<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --maroon:#5C1A25;
      --ink:#1B1414;
      --muted:#8A7A7C;
      --line:#E7DEDD;
    }
    body{margin:0;}
    .av-h{font-family:'Teko',sans-serif;}
  </style>
</helmet>
<div style="width:390px; min-height:844px; background:#FBF8F7; font-family:'Barlow',sans-serif; color:var(--ink); box-sizing:border-box; display:flex; flex-direction:column; align-items:center;">

  <div style="display:flex; align-items:center; gap:8px; padding:22px 0 0;">
    <div style="width:26px; height:26px; border-radius:50%; border:1.5px solid var(--maroon); display:flex; align-items:center; justify-content:center;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#5C1A25" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13c0-5 3.5-9 8-9s8 4 8 9"/></svg>
    </div>
    <div class="av-h" style="font-size:16px; color:var(--maroon); letter-spacing:0.03em;">MUD BOYS</div>
  </div>

  <div style="margin:20px 22px 0; width:280px; background:#fff; border:1px solid var(--line); border-radius:6px; padding:26px 20px; text-align:center;">
    <div style="font-size:11.5px; text-transform:uppercase; letter-spacing:0.07em; color:var(--muted);">Your friends are running at</div>
    <div class="av-h" style="font-size:54px; color:var(--maroon); margin-top:4px; line-height:1;">9:30 AM</div>

    <div style="display:flex; justify-content:center; gap:8px; margin-top:18px;">
      <div style="width:34px; height:34px; border-radius:50%; background:var(--maroon); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;">JP</div>
      <div style="width:34px; height:34px; border-radius:50%; background:var(--maroon); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;">RM</div>
      <div style="width:34px; height:34px; border-radius:50%; background:var(--maroon); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;">CB</div>
    </div>
    <div style="font-size:12px; color:var(--muted); margin-top:8px;">Jacob P. · Ryan M. · Connor B.</div>

    <div style="display:inline-block; margin-top:14px; border:1.5px solid var(--maroon); color:var(--maroon); font-size:11px; font-weight:700; padding:5px 11px; border-radius:20px;">17 spots left</div>
  </div>

  <div style="width:280px; margin-top:18px;">
    <div style="background:var(--maroon); color:#fff; text-align:center; padding:15px; border-radius:24px; font-weight:700; font-size:15px;">JOIN THEM →</div>
  </div>

  <div style="flex:1;"></div>

  <div style="width:280px; margin-bottom:24px; display:flex; align-items:center; justify-content:center; gap:8px; border:1px solid var(--line); border-radius:24px; padding:12px;">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5C1A25" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v14"/></svg>
    <div style="font-size:13px; color:var(--maroon); font-weight:600;">Share Invite</div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
