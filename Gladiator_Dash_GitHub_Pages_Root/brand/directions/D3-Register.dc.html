<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --maroon:#5C1A25;
      --ink:#1B1414;
      --muted:#8A7A7C;
      --line:#E7DEDD;
    }
    body{margin:0;}
    .av-h{font-family:'Teko',sans-serif;}
  </style>
</helmet>
<div style="width:390px; min-height:844px; background:#FBF8F7; font-family:'Barlow',sans-serif; color:var(--ink); box-sizing:border-box; display:flex; flex-direction:column;">

  <div style="display:flex; align-items:center; gap:14px; padding:22px 22px 0;">
    <div style="font-size:20px; color:var(--muted);">←</div>
    <div class="av-h" style="font-size:24px; letter-spacing:0.02em;">CHOOSE YOUR TICKET</div>
  </div>

  <div style="display:flex; flex-direction:column; gap:12px; padding:20px 22px;">

    <div style="display:flex; background:#fff; border:1px solid var(--line); border-radius:4px; overflow:hidden;">
      <div style="width:5px; background:var(--maroon);"></div>
      <div style="flex:1; padding:13px 15px; display:flex; justify-content:space-between; align-items:center;">
        <div>
          <div style="font-size:14.5px; font-weight:600;">Competitive — Student</div>
          <div style="font-size:11.5px; color:var(--muted); margin-top:2px;">Timed heat, every 15 min</div>
        </div>
        <div class="av-h" style="font-size:26px; color:var(--maroon);">$30</div>
      </div>
    </div>

    <div style="display:flex; background:var(--maroon); border-radius:4px; overflow:hidden;">
      <div style="width:5px; background:#fff;"></div>
      <div style="flex:1; padding:13px 15px; display:flex; justify-content:space-between; align-items:center; color:#fff;">
        <div>
          <div style="font-size:14.5px; font-weight:600;">Non-Competitive — Student</div>
          <div style="font-size:11.5px; color:#E6C9CC; margin-top:2px;">Fun-paced heat, every 15 min</div>
        </div>
        <div class="av-h" style="font-size:26px;">$25</div>
      </div>
    </div>

    <div style="display:flex; background:#fff; border:1px solid var(--line); border-radius:4px; overflow:hidden;">
      <div style="width:5px; background:var(--maroon);"></div>
      <div style="flex:1; padding:13px 15px; display:flex; justify-content:space-between; align-items:center;">
        <div>
          <div style="font-size:14.5px; font-weight:600;">Endurance</div>
          <div style="font-size:11.5px; color:var(--muted); margin-top:2px;">No heat — race as long as you want</div>
        </div>
        <div class="av-h" style="font-size:26px; color:var(--maroon);">$40</div>
      </div>
    </div>

    <div style="display:flex; background:#fff; border:1px solid var(--line); border-radius:4px; overflow:hidden;">
      <div style="width:5px; background:#C9B9BB;"></div>
      <div style="flex:1; padding:13px 15px; display:flex; justify-content:space-between; align-items:center;">
        <div>
          <div style="font-size:14.5px; font-weight:600;">Arena</div>
          <div style="font-size:11.5px; color:var(--muted); margin-top:2px;">Event-area access, no race</div>
        </div>
        <div class="av-h" style="font-size:26px; color:var(--maroon);">$10</div>
      </div>
    </div>

  </div>

  <div style="flex:1;"></div>

  <div style="padding:16px 22px; background:var(--maroon); display:flex; align-items:center; justify-content:space-between; gap:16px;">
    <div>
      <div style="font-size:10.5px; color:#E6C9CC; text-transform:uppercase; letter-spacing:0.06em;">Total</div>
      <div class="av-h" style="font-size:24px; color:#fff;">$25.00</div>
    </div>
    <div style="flex:1; background:#fff; color:var(--maroon); font-weight:700; font-size:14.5px; text-align:center; padding:12px; border-radius:22px;">CONTINUE</div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
