<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Gladiator Dash 2027 | Lake Bryan</title>

<link rel="icon" type="image/png" href="./media/opt-helmet.png">
<link rel="apple-touch-icon" href="./media/opt-helmet.png">

<meta property="og:title" content="Come run with 5 people from Mud Boys">
<meta property="og:description" content="Gladiator Dash, 9:30 AM, April 11, Lake Bryan">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Play:wght@400;700&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --ground:#0B1220;
  --raise:#141D2E;
  --raise-2:#1B2639;
  --line:#26334A;
  --ink:#F4F6F8;
  --muted:#95A2B5;
  --cyan:#4FC7E8;
  --cyan-deep:#1D89AC;
  --red:#E3452F;
  --red-ink:#FF8570;
  --ok:#5BD6A0;

  --step--1:0.8125rem;
  --step-0:0.9375rem;
  --step-1:1.125rem;
  --step-2:1.5rem;
  --step-3:2.125rem;

  --pad:20px;
  --radius:3px;
  --ease:cubic-bezier(.16,.84,.28,1);
}

*{box-sizing:border-box;min-width:0;}
html{-webkit-text-size-adjust:100%;overflow-x:hidden;}
body{
  margin:0;
  position:relative;
  background:var(--ground);
  color:var(--ink);
  font-family:'Jost',system-ui,sans-serif;
  font-size:var(--step-0);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

::selection{background:var(--cyan);color:#06101C;}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:2px;}
input,button{font:inherit;color:inherit;caret-color:var(--cyan);}
button{background:none;border:0;padding:0;cursor:pointer;text-align:left;}

*{scrollbar-width:thin;scrollbar-color:var(--line) transparent;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;border:3px solid var(--ground);}

.d{
  font-family:'Play',system-ui,sans-serif;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:-0.015em;
  line-height:0.92;
  margin:0;
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1;}

/* the two brand names always set in the display face the real site uses */
.bn{font-family:'Orbitron','Play',system-ui,sans-serif;font-weight:800;letter-spacing:-0.01em;}
/* tracked-out contexts leave a gap after the span's last letter, which shows up
   as a space before a following comma */
.kicker .bn,.stat .k .bn,.tierlabel .bn{margin-right:-0.1em;}

.wrap{max-width:440px;margin:0 auto;padding:0 var(--pad) 120px;}

/* ---------- chrome ---------- */
.top{
  display:flex;align-items:center;gap:10px;
  padding:18px var(--pad) 0;max-width:440px;margin:0 auto;
}
/* Crops taken from the supplied brand PNGs. Each asset carries transparent
   padding and, in the wordmark's case, two lines of type; these windows pull out
   just the part we want. Percentages resolve against the window, so one rule
   works at any size. Measured from the alpha channel, not by eye. */
.crop{position:relative;overflow:hidden;display:block;flex:none;}
.crop img{position:absolute;max-width:none;}

/* GLADIATOR DASH only, out of the two-line white wordmark (source 2172x724,
   the line sits at y 358-502) */
.crop.words{--h:30px;height:var(--h);aspect-ratio:2172 / 144;}
.crop.words img{width:100%;left:0;top:-248.611%;}
/* hero: size by width so it fills the column instead of overrunning it */
/* Both name lines together, ONE ARMY over GLADIATOR DASH. Content sits at
   x 50-2121, y 208-492 of a 2172x724 source. The window is x 45-2127, y 200-500,
   trimming the left margin so the logo's edge lines up with the copy below it
   rather than sitting indented from it. */
.crop.words.two{aspect-ratio:2082 / 300;}
.crop.words.two img{width:104.323%;left:-2.161%;top:-66.667%;}
.crop.words.fill{width:100%;height:auto;max-width:1000px;}
.crop.words.two.fill{max-width:880px;}

/* The helmet is NOT cropped. It sits in its own square with object-fit:contain,
   so the transparent margin costs a little tightness but nothing can ever be
   clipped. A hand-derived crop window kept shaving the tip off the crest swoop,
   whose antialiased edge is too faint to survive an alpha threshold. */
.helmet{height:var(--h,28px);aspect-ratio:1;object-fit:contain;flex:none;display:block;}

.mark{width:26px;height:30px;flex:none;object-fit:contain;display:block;}

/* hero video, the clip from the current site, as ground rather than as a hero block.
   It lives outside #app so a re-render never tears it down and restarts playback. */
#app{position:relative;z-index:1;}
.herovid{
  position:absolute;top:0;left:0;right:0;height:min(58vh,520px);
  overflow:hidden;z-index:0;pointer-events:none;display:none;
}
.herovid.on{display:block;}
.herovid.tall{height:min(82svh,720px);}
.herovid.tall video{opacity:.42;}
.herovid.tall::after{
  background:linear-gradient(180deg,rgba(11,18,32,.50) 0%,rgba(11,18,32,.34) 34%,
    rgba(11,18,32,.86) 76%,var(--ground) 100%);
}
.herovid video{
  width:100%;height:100%;object-fit:cover;display:block;
  opacity:.34;filter:saturate(.75) contrast(1.06);
}
.herovid::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,
    rgba(11,18,32,.62) 0%,
    rgba(11,18,32,.70) 40%,
    rgba(11,18,32,.92) 78%,
    var(--ground) 100%);
}
.herovid.failed video{display:none;}
@media (prefers-reduced-motion:reduce){ .herovid video{display:none;} }
.wordmark{
  font-family:'Orbitron','Play',sans-serif;font-weight:800;
  text-transform:uppercase;font-size:0.75rem;letter-spacing:0.01em;white-space:nowrap;
}

.top .cause{margin-left:auto;font-size:var(--step--1);color:var(--muted);white-space:nowrap;}
@media (max-width:479px){ .top .cause{display:none;} }

/* ---------- group page ---------- */
.groupname{
  font-size:clamp(2.25rem,11vw,3.25rem);
  margin:26px 0 0;
  font-weight:700;
}
.groupmeta{
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  margin-top:10px;color:var(--muted);font-size:var(--step--1);
  letter-spacing:0.02em;text-transform:uppercase;
}
.groupmeta b{color:var(--ink);font-weight:600;}

.lede{
  margin:22px 0 0;color:var(--muted);font-size:var(--step-1);line-height:1.4;
  max-width:34ch;
}
.lede b{color:var(--ink);font-weight:600;}

.timeblock{margin-top:26px;}
.timelabel{
  font-size:var(--step--1);letter-spacing:0.1em;text-transform:uppercase;
  color:var(--muted);
}
.bigtime{
  font-size:clamp(3.75rem,22vw,6rem);
  color:var(--cyan);
  margin:2px 0 0;
  font-weight:700;
  letter-spacing:-0.03em;
}
.bigtime .ampm{font-size:0.36em;letter-spacing:0.02em;margin-left:.1em;color:var(--cyan-deep);}

.faces{display:flex;align-items:center;margin-top:14px;}
.face{
  width:34px;height:34px;border-radius:50%;
  background:var(--raise-2);border:1.5px solid var(--cyan-deep);
  display:grid;place-items:center;
  font-family:'Play',sans-serif;font-weight:700;
  font-size:0.75rem;letter-spacing:0.02em;
  margin-right:-8px;
}
.face.more{border-color:var(--line);color:var(--muted);background:var(--raise);}
.names{margin-top:12px;color:var(--muted);font-size:var(--step-0);}
.names b{color:var(--ink);font-weight:500;}

.spots{
  display:inline-flex;align-items:center;gap:7px;margin-top:16px;
  font-size:var(--step--1);letter-spacing:0.06em;text-transform:uppercase;
  color:var(--muted);
}
.spots .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none;}
.spots.low{color:var(--red-ink);}
.spots.low .dot{background:var(--red);}
.spots.full{color:var(--red-ink);}

.join{
  display:block;width:100%;margin-top:22px;
  background:var(--cyan);color:#06101C;
  border-radius:var(--radius);
  padding:17px 18px;
  font-family:'Play',sans-serif;
  font-weight:700;
  text-transform:uppercase;letter-spacing:0.01em;
  font-size:1.1875rem;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  transition:transform .18s var(--ease),background .18s var(--ease);
  box-shadow:0 8px 20px -12px rgba(0,0,0,.85);
}
/* Waiting on a choice. Still legible, still obviously the next step — a button
   at .35 opacity reads as absent, which is exactly how the heat step got lost. */
.join.off{
  background:transparent;color:var(--muted);
  border:1px solid var(--line);box-shadow:none;pointer-events:none;
}
.join:hover{background:#6BD5F0;}
.join:active{transform:scale(.988);}
.join svg{width:20px;height:20px;flex:none;}
.join.secondary{
  background:transparent;color:var(--ink);
  border:1px solid var(--line);box-shadow:none;
}
.join.secondary:hover{background:var(--raise);}

.sub{
  display:block;width:100%;text-align:center;margin-top:14px;
  color:var(--muted);font-size:var(--step-0);
  padding:6px;
}
.sub:hover{color:var(--ink);}

/* ---------- roster ---------- */
.rule{height:1px;background:var(--line);border:0;margin:32px 0 0;}
.sectitle{
  font-size:var(--step--1);letter-spacing:0.1em;text-transform:uppercase;
  color:var(--muted);margin:26px 0 0;
}

.heatrow{
  display:flex;align-items:flex-start;gap:14px;
  padding:15px 0;border-bottom:1px solid var(--line);
}
.heatrow:last-child{border-bottom:0;}
.htime{
  font-family:'Play',sans-serif;font-weight:700;
  font-size:1.25rem;letter-spacing:-0.01em;width:82px;flex:none;
  color:var(--ink);
}
.heatrow.isfull .htime{color:var(--muted);text-decoration:line-through;text-decoration-thickness:2px;}
.heatrow.mine .htime{color:var(--cyan);}
.hbody{flex:1;min-width:0;}
.hnames{color:var(--muted);font-size:var(--step-0);line-height:1.45;}
.hnames b{color:var(--ink);font-weight:500;}
.hstate{
  font-size:var(--step--1);letter-spacing:0.05em;text-transform:uppercase;
  color:var(--muted);margin-top:5px;
}
.hstate.low{color:var(--red-ink);}
.hcount{
  font-family:'Play',sans-serif;font-weight:700;
  font-size:1rem;color:var(--muted);flex:none;
}

/* any heat with room is joinable straight from the roster */
button.heatrow{
  width:100%;background:none;border:0;border-bottom:1px solid var(--line);
  font:inherit;color:inherit;text-align:left;cursor:pointer;padding:15px 0;
}
button.heatrow:last-of-type{border-bottom:0;}
button.heatrow:hover .htime,button.heatrow:focus-visible .htime{color:var(--cyan);}
button.heatrow:hover .hgo,button.heatrow:focus-visible .hgo{opacity:1;transform:translateX(2px);}
.hgo{
  width:16px;height:16px;flex:none;color:var(--cyan);opacity:0;align-self:center;
  transition:opacity .16s var(--ease),transform .16s var(--ease);
}
.hgo svg{width:100%;height:100%;display:block;}
@media (hover:none){ .hgo{opacity:.5;} }
.rosterhint{color:var(--muted);font-size:var(--step--1);margin:6px 0 0;}
.htime.hlabel{
  font-family:'Jost',sans-serif;font-weight:600;font-size:.75rem;
  letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
  line-height:1.35;padding-top:3px;
}
.ctanote{color:var(--muted);font-size:var(--step--1);margin:10px 0 0;text-align:center;}
.join.secondary.alt{margin-top:12px;font-size:1rem;padding:14px 18px;justify-content:center;}

.expand{
  width:100%;padding:13px 0;color:var(--cyan);
  font-size:var(--step-0);font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:7px;
}
.expand svg{width:14px;height:14px;transition:transform .2s var(--ease);}
.expand[aria-expanded="true"] svg{transform:rotate(180deg);}

/* ---------- facts ---------- */
.facts{margin-top:8px;}
.fact{
  display:flex;gap:14px;padding:13px 0;
  border-bottom:1px solid var(--line);
  font-size:var(--step-0);
}
.fact:last-child{border-bottom:0;}
.fact dt{color:var(--muted);width:82px;flex:none;
  font-size:var(--step--1);letter-spacing:0.06em;text-transform:uppercase;padding-top:2px;}
.fact dd{margin:0;flex:1;}
.fact dd b{font-weight:600;}
.cause-line{color:var(--cyan);font-weight:600;}

/* ---------- share ---------- */
.share{
  display:flex;align-items:center;justify-content:center;gap:9px;
  width:100%;margin-top:26px;padding:15px;
  border:1px solid var(--line);border-radius:var(--radius);
  color:var(--muted);font-weight:600;font-size:var(--step-0);
  transition:border-color .18s var(--ease),color .18s var(--ease);
}
.share:hover{border-color:var(--cyan-deep);color:var(--ink);}
.share svg{width:17px;height:17px;}

/* ---------- flow ---------- */
.flowbar{
  position:sticky;top:0;z-index:5;
  background:linear-gradient(var(--ground) 72%,transparent);
  padding:14px var(--pad) 16px;max-width:440px;margin:0 auto;
  display:flex;align-items:center;gap:12px;
}
.back{width:34px;height:34px;display:grid;place-items:center;
  border:1px solid var(--line);border-radius:var(--radius);flex:none;color:var(--muted);}
.back:hover{color:var(--ink);border-color:var(--cyan-deep);}
.back svg{width:16px;height:16px;}
.steps{display:flex;gap:5px;flex:1;}
.steps i{height:2px;flex:1;background:var(--line);border-radius:2px;}
.steps i.on{background:var(--cyan);}
.steps i.done{background:var(--cyan-deep);}
.total{
  font-family:'Play',sans-serif;font-weight:700;
  font-size:1.0625rem;flex:none;
}
.total.zero{color:var(--muted);}

.q{font-size:clamp(1.75rem,7vw,2.25rem);margin:8px 0 0;font-weight:700;}
.qsub{color:var(--muted);margin:9px 0 0;font-size:var(--step-0);max-width:36ch;}

.opt{
  display:flex;align-items:center;gap:14px;width:100%;
  padding:16px 0;border-bottom:1px solid var(--line);
  transition:opacity .18s var(--ease);
}
.opt:last-of-type{border-bottom:0;}
.opt .radio,.heatpick .radio{
  width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);
  flex:none;display:grid;place-items:center;transition:border-color .18s var(--ease);
}
.opt .radio i,.heatpick .radio i{width:11px;height:11px;border-radius:50%;background:var(--cyan);transform:scale(0);
  transition:transform .2s var(--ease);}
.opt[aria-checked="true"] .radio,.heatpick[aria-checked="true"] .radio{border-color:var(--cyan);}
.opt[aria-checked="true"] .radio i,.heatpick[aria-checked="true"] .radio i{transform:scale(1);}
.opt .body{flex:1;min-width:0;}
.opt .t{font-family:'Play',sans-serif;font-weight:700;
  text-transform:uppercase;font-size:1.0625rem;letter-spacing:0.005em;}
.opt .s{color:var(--muted);font-size:var(--step--1);margin-top:3px;}
.opt .p{font-family:'Play',sans-serif;font-weight:700;
  font-size:1.125rem;flex:none;}
.opt.off{opacity:.4;pointer-events:none;}

.toggle{
  display:flex;align-items:center;gap:13px;width:100%;
  margin-top:22px;padding:15px;border:1px solid var(--line);border-radius:var(--radius);
}
.switch{
  width:44px;height:26px;border-radius:99px;background:var(--raise-2);
  border:1px solid var(--line);flex:none;position:relative;transition:background .2s var(--ease);
}
.switch i{
  position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
  background:var(--muted);transition:transform .22s var(--ease),background .2s var(--ease);
}
.toggle[aria-checked="true"] .switch{background:var(--cyan-deep);border-color:var(--cyan-deep);}
.toggle[aria-checked="true"] .switch i{transform:translateX(18px);background:var(--ink);}
.toggle .body{flex:1;}
.toggle .t{font-weight:600;}
.toggle .s{color:var(--muted);font-size:var(--step--1);margin-top:2px;}

.heatpick{
  display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
  padding:15px 0;border-bottom:1px solid var(--line);
}
.heatpick .lt{display:flex;align-items:center;gap:14px;min-width:0;}
.heatpick .tm{
  font-family:'Play',sans-serif;font-weight:700;
  font-size:1.375rem;width:86px;flex:none;
}
.heatpick .who{color:var(--muted);font-size:var(--step--1);}
.heatpick .who b{color:var(--cyan);font-weight:600;}
.heatpick .htag{
  display:inline-block;margin-right:8px;padding:2px 7px;border-radius:4px;
  border:1px solid var(--line);color:var(--muted);
  font-family:'Play',sans-serif;font-weight:700;
  font-size:0.6875rem;letter-spacing:.1em;text-transform:uppercase;vertical-align:1px;
}
.heatpick[aria-checked="true"] .htag{border-color:var(--cyan);color:var(--cyan);}
.heatpick .rm{font-size:var(--step--1);color:var(--muted);letter-spacing:0.04em;text-transform:uppercase;flex:none;}
.heatpick .rm.low{color:var(--red-ink);}
.heatpick.full{opacity:.42;pointer-events:none;}
.heatpick.full .tm{text-decoration:line-through;text-decoration-thickness:2px;}
.heatpick[aria-checked="true"]{border-bottom-color:var(--cyan);}
.heatpick[aria-checked="true"] .tm{color:var(--cyan);}

.runner{
  border:1px solid var(--line);border-radius:var(--radius);
  padding:15px;margin-top:12px;
}
.runner .rhead{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
.runner .rn{
  font-family:'Play',sans-serif;font-weight:700;
  text-transform:uppercase;font-size:var(--step--1);letter-spacing:0.08em;color:var(--muted);flex:1;
}
.runner .rm{color:var(--muted);font-size:var(--step--1);}
.runner .rm:hover{color:var(--red-ink);}
.field{
  width:100%;background:var(--raise);border:1px solid var(--line);
  border-radius:var(--radius);padding:13px 14px;color:var(--ink);
  font-size:1rem;transition:border-color .18s var(--ease);
}
.field::placeholder{color:#7A8699;}
.field:focus{border-color:var(--cyan);outline:none;}
.fieldrow{display:flex;gap:10px;}
.addrunner{
  display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  margin-top:12px;padding:15px;border:1px dashed var(--line);border-radius:var(--radius);
  color:var(--cyan);font-weight:600;
}
.addrunner:hover{border-color:var(--cyan-deep);background:var(--raise);}
.addrunner svg{width:15px;height:15px;}

.sumrow{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);align-items:baseline;}
.sumrow .l{flex:1;min-width:0;}
.sumrow .l .n{font-weight:600;}
.sumrow .l .m{color:var(--muted);font-size:var(--step--1);margin-top:2px;}
.sumrow .r{font-family:'Play',sans-serif;font-weight:700;flex:none;}
.sumtotal{display:flex;justify-content:space-between;align-items:baseline;padding:17px 0 0;}
.sumtotal .lab{font-size:var(--step--1);letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);}
.sumtotal .val{font-family:'Play',sans-serif;font-weight:700;font-size:2rem;}

.waiver{
  display:flex;gap:13px;width:100%;align-items:flex-start;
  margin-top:22px;padding:16px;border:1px solid var(--line);border-radius:var(--radius);
  transition:border-color .18s var(--ease);
}
.waiver[aria-checked="true"]{border-color:var(--cyan-deep);}
.waiver .box{
  width:22px;height:22px;border-radius:2px;border:1.5px solid var(--line);flex:none;
  display:grid;place-items:center;margin-top:1px;transition:all .18s var(--ease);
}
.waiver[aria-checked="true"] .box{background:var(--cyan);border-color:var(--cyan);}
.waiver .box svg{width:13px;height:13px;color:#06101C;opacity:0;transition:opacity .15s var(--ease);}
.waiver[aria-checked="true"] .box svg{opacity:1;}
.waiver .body{flex:1;font-size:var(--step-0);line-height:1.45;}
.waiver .body .note{color:var(--muted);font-size:var(--step--1);margin-top:4px;}

.handoff{
  margin-top:16px;padding:14px;border:1px solid var(--line);border-radius:var(--radius);
  display:flex;gap:11px;color:var(--muted);font-size:var(--step--1);line-height:1.45;
}
.handoff svg{width:16px;height:16px;flex:none;color:var(--muted);margin-top:2px;}

/* ---------- handoff + confirm ---------- */
.center{
  min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:40px var(--pad);max-width:440px;margin:0 auto;
}
.spinner{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);
  border-top-color:var(--cyan);animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.stamp{
  display:inline-grid;place-items:center;width:78px;height:78px;border-radius:50%;
  border:2px solid var(--ok);color:var(--ok);

<!--
THESIS: The category read straight, a race site, refusing the concept-world detour and the OCR habit of selling mud while burying the schedule. Here the schedule is the product.
OWN-WORLD: Navy ground, cyan owning every time and count, red only for scarcity. Play caps for times, names and totals and Jost for prose, both carried over from the org's own site. Rules and rows, never cards as structure.
STORY: A friend's link lands mid group chat. The visitor sees who is running and when, taps one time, and is registered before the thread moves on.
FIRST VIEWPORT: Group name in expanded caps, the suggested heat time at display scale in cyan, the runners in it, spots remaining, and one full-width join control carrying that time.
FORM: Canon, taken as the standing exit after two re-rolls; craft bar Spartan, Strava, Partiful; seed key f36d3c6a.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->

<div class="herovid" id="herovid" aria-hidden="true">
  <video id="herovideo" autoplay muted loop playsinline preload="auto" tabindex="-1"></video>
</div>

<div id="app"></div>

<button class="demobtn" id="demobtn" aria-label="Prototype scenarios">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/><circle cx="18" cy="18" r="2.6"/></svg>
</button>

<div class="demo" id="demo">
  <h4>Prototype scenarios</h4>
  <p>Switch the underlying data to see how each state behaves. Not part of the design.</p>
  <div class="chips" id="scenarios"></div>
  <h4>Jump to</h4>
  <div class="chips" id="jumps"></div>
</div>

<script>
/* ============================ mock data ============================ */
const ASSET_HELMET = './media/opt-helmet.png';      /* __ASSET_HELMET__ */
const ASSET_WORDS  = './media/words-white.png';   /* __ASSET_WORDS__ */
const ASSET_VIDEO  = './media/hero-480.mp4';      /* __ASSET_VIDEO__ */

const HELMET = h => `<img class="helmet" style="--h:${h||'28px'}" src="${ASSET_HELMET}" alt="">`;
const WORDSFILL = `<span class="crop words two fill"><img src="${ASSET_WORDS}" alt="One Army Gladiator Dash"></span>`;
const WORDS  = h => `<span class="crop words" style="--h:${h}"><img src="${ASSET_WORDS}" alt="Gladiator Dash"></span>`;

const TICKETS = [
  {id:'comp',    name:'Competitive',     sub:'Timed. Race the clock and everyone in your heat.', student:30, open:35, heat:true},
  {id:'noncomp', name:'Non-Competitive', sub:'Same course, same obstacles, no clock.',           student:25, open:30, heat:true},
  {id:'endur',   name:'Endurance',       sub:'Starts with the first heat. Run as long as you want.', flat:40, heat:false},
  {id:'arena',   name:'Arena',           sub:'Event area access. No course, no heat.',           flat:10, heat:false}
];

const HEAT_TIMES = ['9:00','9:15','9:30','9:45','10:00','10:15','10:30','10:45','11:00','11:15'];

// Some heats are designated Corps heats. Per the org (2026-08-24) this is a LABEL on
// the heat picker only — it is not a separate ticket, not a separate category, and
// nothing enforces who may pick one. Placeholder times until the real schedule lands.
const CORPS_HEATS = ['9:15','10:00','10:45'];

const SCENARIOS = {
  friends:{
    label:'Friend group (5)',
    group:{name:'Mud Boys', slug:'mud-boys-x82k', type:'custom'},
    members:[
      {n:'Jacob P.', h:'9:30'},{n:'Ryan M.', h:'9:30'},{n:'Connor B.', h:'9:30'},
      {n:'Sam T.', h:'9:45'},{n:'Luke C.', h:'9:45'}
    ],
    caps:{'9:00':4,'9:15':0,'9:30':17,'9:45':22,'10:00':30,'10:15':30,'10:30':30,'10:45':30,'11:00':30,'11:15':30}
  },
  outfit:{
    label:'Corps outfit (34)',
    group:{name:'Squadron 17', slug:'squadron-17-4KQ2', type:'official'},
    members:[
      {n:'Jacob P.',h:'9:00'},{n:'Ryan M.',h:'9:00'},{n:'Connor B.',h:'9:00'},{n:'Sam T.',h:'9:00'},
      {n:'Luke C.',h:'9:15'},{n:'Matt R.',h:'9:15'},{n:'Drew K.',h:'9:15'},
      {n:'Cole H.',h:'9:30'},{n:'Wes A.',h:'9:30'},{n:'Trey L.',h:'9:30'},{n:'Nate D.',h:'9:30'},
      {n:'Brooks V.',h:'9:30'},{n:'Cade W.',h:'9:30'},{n:'Reid S.',h:'9:30'},
      {n:'Jay F.',h:'9:45'},{n:'Owen G.',h:'9:45'},{n:'Tate M.',h:'9:45'},{n:'Beau R.',h:'9:45'},
      {n:'Knox P.',h:'10:00'},{n:'Cash B.',h:'10:00'},{n:'Rhett T.',h:'10:00'},
      {n:'Ford N.',h:'10:15'},{n:'Gage L.',h:'10:15'},
      {n:'Hayes O.',h:'10:30'},{n:'Boone C.',h:'10:30'},{n:'Crew J.',h:'10:30'},
      {n:'Lane K.',h:'10:45'},{n:'Colt D.',h:'10:45'},
      {n:'Zane W.',h:'11:00'},{n:'Ace M.',h:'11:00'},{n:'Rye S.',h:'11:00'},
      {n:'Dax H.',h:'ENDURANCE'},{n:'Sage B.',h:'ARENA'},{n:'Pike R.',h:'ARENA'}
    ],
    caps:{'9:00':0,'9:15':6,'9:30':2,'9:45':11,'10:00':19,'10:15':24,'10:30':21,'10:45':28,'11:00':26,'11:15':30}
  },
  seed:{
    label:'Seed state (1)',
    group:{name:'Mud Boys', slug:'mud-boys-x82k', type:'custom'},
    members:[{n:'Jacob P.', h:'9:30'}],
    caps:{'9:00':24,'9:15':26,'9:30':29,'9:45':30,'10:00':30,'10:15':30,'10:30':30,'10:45':30,'11:00':30,'11:15':30}
  },
  theirsfull:{
    label:'Their heats full',
    group:{name:'Mud Boys', slug:'mud-boys-x82k', type:'custom'},
    members:[
      {n:'Jacob P.', h:'9:30'},{n:'Ryan M.', h:'9:30'},{n:'Connor B.', h:'9:30'},
      {n:'Sam T.', h:'9:45'},{n:'Luke C.', h:'9:45'},
      {n:'Dax H.', h:'ENDURANCE'},{n:'Cole R.', h:'ENDURANCE'},
      {n:'Sage B.', h:'ARENA'},{n:'Pike R.', h:'ARENA'}
    ],
    caps:{'9:00':0,'9:15':0,'9:30':0,'9:45':0,'10:00':14,'10:15':21,'10:30':26,'10:45':30,'11:00':30,'11:15':30}

    members:[
      {n:'Jacob P.', h:'9:30'},{n:'Ryan M.', h:'9:30'},{n:'Connor B.', h:'9:45'},
      {n:'Sam T.', h:'10:00'},{n:'Luke C.', h:'10:15'}
    ],
    caps:{'9:00':0,'9:15':0,'9:30':0,'9:45':0,'10:00':0,'10:15':0,'10:30':0,'10:45':0,'11:00':0,'11:15':0}
  }
};

const REVEAL_THRESHOLD = 3;   // org decision: the counter's reveal threshold applies to group pages too

/* ============================ state ============================ */
let S = {
  scen:'friends',
  view:'home',
  hist:[],
  ticket:null,
  student:true,
  heat:null,
  runners:[{first:'',last:''}],
  waiver:false,
  rosterOpen:false
};
const D = () => SCENARIOS[S.scen];

const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const initials = n => n.split(' ').map(p=>p[0]).join('').slice(0,2).toUpperCase();
const ampm = t => { const h=+t.split(':')[0]; return h<12?'AM':'PM'; };
const inHeat = t => D().members.filter(m=>m.h===t);
const heatCap = t => D().caps[t] ?? 30;
const noHeat = () => D().members.filter(m=>m.h==='ENDURANCE'||m.h==='ARENA');
const racing = () => D().members.filter(m=>m.h!=='ENDURANCE'&&m.h!=='ARENA');

const toMin = t => { const [h,m]=t.split(':').map(Number); return h*60+m; };

/* The rule: the heat holding the most group members that still has room.
   When every heat the group is in has filled, fall back to the open heat
   CLOSEST IN TIME to where they are, not the earliest of the day, which is
   what a naive scan returns and which can be hours away from your friends. */
function suggestedHeat(){
  const open = HEAT_TIMES.filter(t=>heatCap(t)>0);
  if(!open.length) return null;

  let best=null, bestN=0;
  for(const t of open){
    const n = inHeat(t).length;
    if(n>bestN){ bestN=n; best=t; }
  }
  if(best) return best;

  const theirs = HEAT_TIMES.filter(t=>inHeat(t).length>0).map(toMin);
  if(!theirs.length) return open[0];
  let pick=open[0], bestD=Infinity;
  for(const t of open){
    const d = Math.min(...theirs.map(x=>Math.abs(toMin(t)-x)));
    if(d<bestD){ bestD=d; pick=t; }
  }
  return pick;
}

/* true when the group's own heats are all full and we're offering a neighbour */
function isDisplaced(sug){
  return !!sug && inHeat(sug).length===0 && racing().length>0;
}
function ticketOf(id){ return TICKETS.find(t=>t.id===id); }
function priceOf(t){ return t.flat ?? (S.student ? t.student : t.open); }
function total(){ const t=ticketOf(S.ticket); return t ? priceOf(t)*S.runners.length : 0; }

/* ============================ render ============================ */
const VIEWS = {
  home:viewHome, group:viewGroup, ticket:viewTicket, heat:viewHeat, runners:viewRunners,
  review:viewReview, handoff:viewHandoff, confirm:viewConfirm, preview:viewPreview,
  about:viewAbout, course:viewCourse, giveback:viewGiveback, leaderboard:viewLeaderboard,
  sponsors:viewSponsors, raffle:viewRaffle, faq:viewFaq
};

/* the persistent hero clip only belongs on the two views that use it as ground */
const HERO_VIEWS = {home:'tall', group:''};

let lastView = null;

/* Scroll to the top only when the SCREEN changes. Expanding the roster, ticking
   the waiver, or adding a runner re-renders the same screen in place, and yanking
   the page to the top there loses the reader's spot for no reason. */
function render(forceTop){
  document.getElementById('app').innerHTML = VIEWS[S.view]();
  if((forceTop || S.view !== lastView) && S.view !== 'handoff') window.scrollTo(0,0);
  lastView = S.view;
  const hv = document.getElementById('herovid');
  const mode = HERO_VIEWS[S.view];
  hv.classList.toggle('on', mode !== undefined);
  hv.classList.toggle('tall', mode === 'tall');
  try{ history.replaceState(null,'',`#${S.scen}/${S.view}`); }catch(e){}
  renderDemo();
}

/* Runs once. Autoplay only reliably engages when muted is set as a property and
   play() is called from script; the markup attributes alone are not enough in
   every engine. Calling this per render would restart the clip on every click. */
function startHeroVideo(){
  const v = document.getElementById('herovideo');
  if(!v) return;
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){ v.remove(); return; }
  v.muted = true;
  v.defaultMuted = true;
  v.playsInline = true;
  v.addEventListener('loadeddata', ()=>v.play().catch(()=>{}), {once:true});
  v.addEventListener('error', ()=>document.getElementById('herovid').classList.add('failed'), {once:true});
  v.src = ASSET_VIDEO;
}

function readHash(){
  const [sc,v] = (location.hash||'').replace(/^#/,'').split('/');
  if(SCENARIOS[sc]) S.scen = sc;
  if(VIEWS[v] && v!=='handoff') S.view = v;
  if(['ticket','heat','runners','review','confirm','preview'].includes(S.view)){
    if(!S.ticket) S.ticket='comp';
    if(!S.heat && ticketOf(S.ticket).heat) S.heat=suggestedHeat();
    if(S.view==='review'||S.view==='confirm'){
      if(!S.runners[0].first){ S.runners=[{first:'Jacob',last:'Pabian'},{first:'Ryan',last:'Mata'}]; }
      S.waiver=true;
    }
  }
}

function renderDemo(){
  document.getElementById('scenarios').innerHTML =
    Object.entries(SCENARIOS).map(([k,v])=>
      `<button class="chip ${S.scen===k?'on':''}" data-scen="${k}">${v.label}</button>`).join('');
  document.getElementById('jumps').innerHTML =
    [['home','Home'],['group','Group page'],['ticket','Tickets'],['heat','Heats'],['runners','Runners'],
     ['review','Review'],['confirm','Confirmed'],['preview','Link preview'],
     ['course','Course'],['giveback','Giveback'],['leaderboard','Standings'],
     ['sponsors','Sponsors'],['about','About'],['raffle','Raffle'],['faq','FAQ']]
    .map(([k,l])=>`<button class="chip ${S.view===k?'on':''}" data-jump="${k}">${l}</button>`).join('');
}

/* ============================ events ============================ */
/* A real visit stack, not a static map of "what usually precedes what". The flow
   skips steps depending on where you entered and which ticket you picked, so the
   only honest answer to "back" is the screen you actually came from. */
function go(v){ if(v!==S.view){ S.hist.push(S.view); S.view=v; } }
function back(){ S.view = S.hist.pop() || 'group'; }

document.addEventListener('click', e=>{
  const t = e.target.closest('[data-join],[data-go],[data-ticket],[data-student],[data-heat],[data-next],[data-add],[data-del],[data-waiver],[data-back],[data-toggle],[data-share],[data-scen],[data-jump]');
  if(!t){
    if(!e.target.closest('#demo,#demobtn')) document.getElementById('demo').classList.remove('open');
    return;
  }
  const g=k=>t.getAttribute(k);
  let forceTop=false;

  if(g('data-join')){ S.heat=g('data-join'); go('ticket'); }
  else if(g('data-go')){
    const v=g('data-go');
    if(g('data-arena')){ S.ticket='arena'; S.heat=null; }
    if(v==='heat'){ S.heat=null; go('ticket'); }
    /* home and the group page are top-level destinations, so arriving at either
       clears the trail rather than leaving a half-finished registration behind
       the back button */
    else if(v==='group'||v==='home'){ S.hist=[]; S.view=v; forceTop=true; }
    else go(v);
  }
  else if(g('data-ticket')){
    S.ticket=g('data-ticket');
    if(!ticketOf(S.ticket).heat) S.heat=null;
  }
  else if(g('data-student')) S.student=!S.student;
  else if(g('data-heat')) S.heat=g('data-heat');
  else if(g('data-next')){
    const s=g('data-next');
    if(s==='ticket') go(ticketOf(S.ticket).heat && !S.heat ? 'heat' : 'runners');
    else if(s==='heat') go('runners');
    else if(s==='runners') go('review');
    else if(s==='review') go('handoff');
  }
  else if(g('data-add')) S.runners.push({first:'',last:''});
  else if(g('data-del')) S.runners.splice(+g('data-del'),1);
  else if(g('data-waiver')) S.waiver=!S.waiver;
  else if(g('data-back')) back();
  else if(g('data-toggle')) S.rosterOpen=!S.rosterOpen;
  else if(g('data-share')){
    const url=`https://gladiatordash.com/g/${D().group.slug}?r=a7f2`;
    const text=`Running Gladiator Dash${S.heat?` at ${S.heat}`:''}. Join my group:`;
    if(navigator.share) navigator.share({title:'Gladiator Dash',text,url}).catch(()=>{});
    else { navigator.clipboard?.writeText(`${text} ${url}`); t.innerHTML = ICON.check+' Link copied'; return; }
    return;
  }
  else if(g('data-scen')){ S.scen=g('data-scen'); S.heat=null; S.rosterOpen=false; S.hist=[]; S.view='group'; forceTop=true; }
  else if(g('data-jump')){
    S.hist=[]; S.view=g('data-jump');
    if(!S.ticket) S.ticket='comp';
    if(!S.heat && ticketOf(S.ticket).heat) S.heat=suggestedHeat();
    forceTop=true;
  }
  render(forceTop);
});

document.addEventListener('keydown', e=>{
  if(e.key!=='Enter' && e.key!==' ') return;
  const t=e.target.closest('[role="radio"],[role="switch"],[role="checkbox"]');
  if(t){ e.preventDefault(); t.click(); }
});

document.addEventListener('input', e=>{
  const f=e.target.closest('[data-f]');
  if(!f) return;
  S.runners[+f.getAttribute('data-i')][f.getAttribute('data-f')] = f.value;
  const t=document.querySelector('.flowbar .total');
  if(t) t.textContent = total()?'$'+total():',';
});

document.getElementById('demobtn').addEventListener('click', ()=>{
  document.getElementById('demo').classList.toggle('open');
});

readHash();
render();
startHeroVideo();
</script>
</body>
</html>
