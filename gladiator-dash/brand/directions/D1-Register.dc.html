<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --bg:#10151F;
      --card:#171E2C;
      --cyan:#4FC7E8;
      --red:#E3452F;
      --ink:#F4F6F8;
      --muted:#8C97A8;
    }
    body{margin:0;}
    .fo-h1{font-family:'Bebas Neue',sans-serif; letter-spacing:0.01em;}
  </style>
</helmet>
<div style="width:390px; min-height:844px; background:var(--bg); font-family:'Work Sans',sans-serif; color:var(--ink); box-sizing:border-box; display:flex; flex-direction:column;">

  <div style="display:flex; align-items:center; gap:14px; padding:22px 22px 0;">
    <div style="font-size:20px; color:var(--muted);">←</div>
    <div class="fo-h1" style="font-size:20px; letter-spacing:0.03em;">SELECT YOUR TICKET</div>
  </div>

  <div style="display:flex; flex-direction:column; gap:12px; padding:22px;">

    <div style="display:flex; background:var(--card); border-radius:3px; overflow:hidden;">
      <div style="width:4px; background:var(--cyan);"></div>
      <div style="flex:1; padding:14px 16px; display:flex; justify-content:space-between; align-items:center;">
        <div>
          <div style="font-size:15px; font-weight:600;">Competitive — Student</div>
          <div style="font-size:12px; color:var(--muted); margin-top:3px;">Timed heat · every 15 min</div>
        </div>
        <div class="fo-h1" style="font-size:24px; color:var(--cyan);">$30</div>
      </div>
    </div>

    <div style="display:flex; background:var(--card); border-radius:3px; overflow:hidden; border:1.5px solid var(--cyan);">
      <div style="width:4px; background:var(--cyan);"></div>
      <div style="flex:1; padding:14px 16px; display:flex; justify-content:space-between; align-items:center;">
        <div>
          <div style="font-size:15px; font-weight:600;">Non-Competitive — Student</div>
          <div style="font-size:12px; color:var(--muted); margin-top:3px;">Fun-paced heat · every 15 min</div>
        </div>
        <div class="fo-h1" style="font-size:24px; color:var(--cyan);">$25</div>
      </div>
      <div style="display:flex; align-items:center; padding-right:14px;">
        <div style="width:20px; height:20px; border-radius:50%; background:var(--cyan); display:flex; align-items:center; justify-content:center; color:#0A1119; font-size:12px; font-weight:800;">✓</div>
      </div>
    </div>

    <div style="display:flex; background:var(--card); border-radius:3px; overflow:hidden;">
      <div style="width:4px; background:var(--red);"></div>
      <div style="flex:1; padding:14px 16px; display:flex; justify-content:space-between; align-items:center;">
        <div>
          <div style="font-size:15px; font-weight:600;">Endurance</div>
          <div style="font-size:12px; color:var(--muted); margin-top:3px;">No heat — go as long as you want</div>
        </div>
        <div class="fo-h1" style="font-size:24px; color:var(--ink);">$40</div>
      </div>
    </div>

    <div style="display:flex; background:var(--card); border-radius:3px; overflow:hidden;">
      <div style="width:4px; background:#5B6472;"></div>
      <div style="flex:1; padding:14px 16px; display:flex; justify-content:space-between; align-items:center;">
        <div>
          <div style="font-size:15px; font-weight:600;">Arena</div>
          <div style="font-size:12px; color:var(--muted); margin-top:3px;">Event-area access, no race</div>
        </div>
        <div class="fo-h1" style="font-size:24px; color:var(--ink);">$10</div>
      </div>
    </div>

  </div>

  <div style="flex:1;"></div>

  <div style="padding:16px 22px; background:var(--card); display:flex; align-items:center; justify-content:space-between; gap:16px;">
    <div>
      <div style="font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em;">Total</div>
      <div class="fo-h1" style="font-size:22px;">$25.00</div>
    </div>
    <div style="flex:1; background:var(--cyan); color:#0A1119; font-family:'Bebas Neue',sans-serif; font-size:17px; letter-spacing:0.03em; text-align:center; padding:13px; border-radius:3px;">CONTINUE →</div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
