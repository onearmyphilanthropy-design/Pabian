<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Permanent+Marker&family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --paper:#F7F2E4;
      --ink:#181410;
      --lime:#C7EA46;
      --pink:#F0479A;
      --tape:#F3D34A;
      --muted:#8A8066;
    }
    body{margin:0;}
    .mf-stamp{font-family:'Archivo Black',sans-serif;}
    .mf-marker{font-family:'Permanent Marker',cursive;}
  </style>
</helmet>
<div style="width:390px; min-height:844px; background:var(--paper); font-family:'Space Grotesk',sans-serif; color:var(--ink); box-sizing:border-box; position:relative; overflow:hidden;">
  <div style="position:absolute; inset:0; background-image:radial-gradient(rgba(24,20,16,0.05) 1px, transparent 1px); background-size:14px 14px; pointer-events:none;"></div>

  <div style="position:relative; display:flex; align-items:center; justify-content:space-between; padding:20px 20px 0;">
    <div style="display:flex; align-items:center; gap:8px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#181410" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 13c0-5 3.5-9 8-9s8 4 8 9"/>
        <path d="M4 13v3a2 2 0 0 0 2 2h1"/>
        <path d="M20 13v3a2 2 0 0 1-2 2h-1"/>
        <path d="M12 4v6"/>
      </svg>
      <div class="mf-stamp" style="font-size:14px;">GLAD DASH</div>
    </div>
    <div style="transform:rotate(-6deg); background:var(--pink); color:#fff; font-size:10px; font-weight:700; letter-spacing:0.04em; padding:4px 9px; border-radius:20px; text-transform:uppercase;">Mud Szn</div>
  </div>

  <div style="position:relative; margin:26px auto 0; width:250px; transform:rotate(-3deg);">
    <div style="background:#fff; padding:10px 10px 34px; box-shadow:0 10px 18px rgba(0,0,0,0.15);">
      <div style="height:170px; background:linear-gradient(140deg,#5C6B3F 0%,#3C4A2A 55%,#22314A 100%); position:relative; overflow:hidden;">
        <div style="position:absolute; inset:0; background:repeating-linear-gradient(100deg, rgba(255,255,255,0.06) 0 2px, transparent 2px 18px);"></div>
      </div>
      <div class="mf-marker" style="font-size:15px; margin-top:8px; text-align:center; color:#3a352c;">it's giving mud 🤎</div>
    </div>
    <div style="position:absolute; top:-14px; left:50%; transform:translateX(-50%) rotate(2deg); width:70px; height:22px; background:var(--tape); opacity:0.85;"></div>
  </div>

  <div style="position:relative; padding:26px 22px 0; text-align:center;">
    <div class="mf-stamp" style="font-size:30px; line-height:1.05; transform:rotate(-1.5deg);">
      SIGN UP BEFORE<br>YOUR ROOMMATE DOES
    </div>
  </div>

  <div style="position:relative; padding:22px 40px 0;">
    <div style="background:var(--pink); color:#fff; text-align:center; padding:15px; border-radius:3px; border:2.5px solid var(--ink); transform:rotate(-1.5deg); font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px;">
      REGISTER →
    </div>
    <div class="mf-marker" style="text-align:center; font-size:14px; margin-top:10px; color:#5c5647; transform:rotate(1deg);">literally takes 2 min</div>
  </div>

  <div style="position:relative; margin-top:24px; display:flex; justify-content:center; gap:10px;">
    <div style="background:var(--lime); font-size:11px; font-weight:700; padding:5px 10px; border-radius:20px; transform:rotate(2deg);">APRIL 11</div>
    <div style="background:#fff; border:1.5px solid var(--ink); font-size:11px; font-weight:700; padding:5px 10px; border-radius:20px; transform:rotate(-3deg);">LAKE BRYAN</div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
