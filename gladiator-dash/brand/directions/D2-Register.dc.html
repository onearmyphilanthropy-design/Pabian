<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Permanent+Marker&family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --paper:#F7F2E4;
      --ink:#181410;
      --lime:#C7EA46;
      --pink:#F0479A;
      --muted:#8A8066;
    }
    body{margin:0;}
    .mf-stamp{font-family:'Archivo Black',sans-serif;}
    .mf-marker{font-family:'Permanent Marker',cursive;}
  </style>
</helmet>
<div style="width:390px; min-height:844px; background:var(--paper); font-family:'Space Grotesk',sans-serif; color:var(--ink); box-sizing:border-box; display:flex; flex-direction:column;">

  <div class="mf-marker" style="padding:22px 22px 0; font-size:26px; transform:rotate(-1deg);">pick ur ticket</div>

  <div style="display:flex; flex-direction:column; gap:14px; padding:18px 22px;">

    <div style="position:relative; background:#fff; border:2px solid var(--ink); border-radius:2px; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; transform:rotate(-0.6deg);">
      <div>
        <div style="font-size:14.5px; font-weight:700;">Competitive — Student</div>
        <div style="font-size:11.5px; color:var(--muted); margin-top:3px;">timed heat, every 15 min</div>
      </div>
      <div class="mf-stamp" style="font-size:20px;">$30</div>
    </div>

    <div style="position:relative; background:var(--lime); border:2px solid var(--ink); border-radius:2px; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; transform:rotate(0.7deg);">
      <div>
        <div style="font-size:14.5px; font-weight:700;">Non-Comp — Student</div>
        <div style="font-size:11.5px; color:#3f3a2c; margin-top:3px;">just vibes, every 15 min</div>
      </div>
      <div class="mf-stamp" style="font-size:20px;">$25</div>
      <div style="position:absolute; top:-10px; right:-8px; background:var(--pink); color:#fff; font-size:9.5px; font-weight:700; padding:3px 7px; border-radius:20px; transform:rotate(8deg);">picked</div>
    </div>

    <div style="position:relative; background:#fff; border:2px solid var(--ink); border-radius:2px; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; transform:rotate(-0.4deg);">
      <div>
        <div style="font-size:14.5px; font-weight:700;">Endurance</div>
        <div style="font-size:11.5px; color:var(--muted); margin-top:3px;">go till you tap out</div>
      </div>
      <div class="mf-stamp" style="font-size:20px;">$40</div>
    </div>

    <div style="position:relative; background:#fff; border:2px solid var(--ink); border-radius:2px; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; transform:rotate(0.5deg);">
      <div>
        <div style="font-size:14.5px; font-weight:700;">Arena</div>
        <div style="font-size:11.5px; color:var(--muted); margin-top:3px;">just here for the vibes</div>
      </div>
      <div class="mf-stamp" style="font-size:20px;">$10</div>
    </div>

  </div>

  <div style="flex:1;"></div>

  <div style="padding:16px 22px 24px; display:flex; align-items:center; gap:14px;">
    <div>
      <div style="font-size:10.5px; color:var(--muted); text-transform:uppercase;">total</div>
      <div class="mf-stamp" style="font-size:20px;">$25</div>
    </div>
    <div style="flex:1; background:var(--pink); color:#fff; border:2.5px solid var(--ink); text-align:center; padding:13px; border-radius:3px; font-weight:700; transform:rotate(-1deg);">NEXT →</div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
