    <div class="av-b" style="background:#fff; color:var(--maroon); font-weight:700; font-size:15px; text-align:center; padding:15px; border-radius:24px;">REGISTER NOW</div>

  <div style="flex:1;"></div>
  <div style="height:10px; display:flex;">
