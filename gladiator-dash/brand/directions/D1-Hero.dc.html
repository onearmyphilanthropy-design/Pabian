<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --bg:#10151F;
      --card:#171E2C;
      --cyan:#4FC7E8;
      --red:#E3452F;
      --ink:#F4F6F8;
      --muted:#8C97A8;
    }
    body{margin:0;}
    a{color:var(--cyan);} a:hover{color:#7ad6ef;}
    .fo-h1{font-family:'Bebas Neue',sans-serif; letter-spacing:0.01em;}
  </style>
</helmet>
<div style="width:390px; min-height:844px; background:var(--bg); font-family:'Work Sans',sans-serif; color:var(--ink); box-sizing:border-box; display:flex; flex-direction:column;">

  <div style="display:flex; align-items:center; gap:10px; padding:22px 22px 0;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4FC7E8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 13c0-5 3.5-9 8-9s8 4 8 9"/>
      <path d="M4 13v3a2 2 0 0 0 2 2h1"/>
      <path d="M20 13v3a2 2 0 0 1-2 2h-1"/>
      <path d="M12 4v6"/>
      <path d="M9 10l1.5 4"/>
      <path d="M15 10l-1.5 4"/>
    </svg>
    <div class="fo-h1" style="font-size:18px; letter-spacing:0.06em;">GLADIATOR DASH</div>
  </div>

  <div style="margin:18px 22px 0; position:relative; height:210px; border-radius:4px; overflow:hidden; background:linear-gradient(135deg,#1B2A22 0%,#2E3B22 45%,#122430 100%);">
    <div style="position:absolute; inset:0; background:repeating-linear-gradient(115deg, rgba(79,199,232,0.10) 0px, rgba(79,199,232,0.10) 2px, transparent 2px, transparent 26px);"></div>
    <div style="position:absolute; right:-30px; top:-30px; width:160px; height:160px; background:var(--red); opacity:0.18; border-radius:50%; filter:blur(2px);"></div>
    <div style="position:absolute; left:16px; bottom:14px; font-family:'Work Sans',sans-serif; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:rgba(244,246,248,0.55);">Lake Bryan · Obstacle Field</div>
  </div>

  <div style="padding:22px 22px 0;">
    <div class="fo-h1" style="font-size:44px; line-height:0.95; color:var(--ink);">GET MUDDY.<br>GET AFTER IT.</div>
    <div style="margin-top:10px; font-size:14px; color:var(--muted); line-height:1.5;">
      April 11, 2027 · Lake Bryan<br>Benefiting @stillcreekranch
    </div>
  </div>

  <div style="display:flex; gap:10px; padding:20px 22px 0;">
    <div style="flex:1; background:var(--card); border-radius:3px; padding:14px;">
      <div class="fo-h1" style="font-size:30px; color:var(--cyan); line-height:1;">62</div>
      <div style="font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); margin-top:4px;">Days Out</div>
    </div>
    <div style="flex:1; background:var(--card); border-radius:3px; padding:14px;">
      <div class="fo-h1" style="font-size:30px; color:var(--ink); line-height:1;">800+</div>
      <div style="font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); margin-top:4px;">Registered</div>
    </div>
    <div style="display:flex; align-items:center;">
      <div style="background:var(--red); color:#fff; font-size:10.5px; font-weight:700; letter-spacing:0.06em; padding:6px 9px; border-radius:2px; text-transform:uppercase; white-space:nowrap;">Reg Open</div>
    </div>
  </div>

  <div style="padding:22px 22px 0;">
    <div style="background:var(--cyan); color:#0A1119; font-family:'Bebas Neue',sans-serif; font-size:19px; letter-spacing:0.03em; text-align:center; padding:15px; border-radius:3px;">REGISTER NOW →</div>
  </div>

  <div style="flex:1;"></div>
  <div style="height:14px; background:repeating-linear-gradient(45deg,#1B222E 0,#1B222E 8px,#161C26 8px,#161C26 16px);"></div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
